<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent — Personal Assistant</title>
<style>
/* ===== CSS RESET & VARIABLES ===== */
:root {
  --bg-primary: #0f0f14;
  --bg-secondary: #1a1a24;
  --bg-tertiary: #24243a;
  --bg-hover: #2a2a44;
  --text-primary: #e8e8f0;
  --text-secondary: #9999bb;
  --text-muted: #666688;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-dark: #4834d4;
  --success: #00b894;
  --warning: #fdcb6e;
  --danger: #e17055;
  --border: #2d2d4a;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --transition: 0.2s ease;
  --sidebar-w: 280px;
  --header-h: 56px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
}

/* ===== LAYOUT ===== */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  height: 100vh;
}

/* ===== HEADER ===== */
#header {
  grid-column: 1 / -1;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 100;
}

#header .logo {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

#header .tabs {
  display: flex;
  gap: 4px;
  flex: 1;
}

.tab-btn {
  padding: 8px 16px;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
}

.tab-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.tab-btn.active { background: var(--accent); color: #fff; }

#settings-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
#settings-btn:hover { background: var(--accent); color: #fff; }

/* ===== SIDEBAR ===== */
#sidebar {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header input {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
}

.sidebar-header input:focus { border-color: var(--accent); }

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.sidebar-item {
  padding: 10px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2px;
}

.sidebar-item:hover { background: var(--bg-hover); }
.sidebar-item.active { background: var(--bg-tertiary); border-left: 3px solid var(--accent); }

.sidebar-item .title {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.sidebar-item .meta {
  font-size: 11px;
  color: var(--text-muted);
}

.sidebar-item .delete-btn {
  opacity: 0;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  transition: var(--transition);
}

.sidebar-item:hover .delete-btn { opacity: 1; }

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid var(--border);
}

.btn {
  padding: 8px 16px;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-block { width: 100%; justify-content: center; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ===== MAIN CONTENT ===== */
#main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.panel { display: none; flex-direction: column; height: 100%; }
.panel.active { display: flex; }

/* ===== CHAT PANEL ===== */
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  animation: msgIn 0.3s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  background: var(--accent);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.message.assistant {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.message.system {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-muted);
  align-self: center;
  font-size: 12px;
  max-width: 90%;
}

.message.tool-call {
  background: rgba(0,184,148,0.1);
  border: 1px solid var(--success);
  color: var(--success);
  align-self: center;
  font-size: 12px;
  font-family: monospace;
  max-width: 90%;
}

.message pre {
  background: var(--bg-primary);
  padding: 12px;
  border-radius: var(--radius);
  overflow-x: auto;
  margin: 8px 0;
  font-size: 13px;
}

.message code {
  font-family: 'Fira Code', 'Cascadia Code', monospace;
  font-size: 13px;
}

.message p { margin-bottom: 8px; }
.message p:last-child { margin-bottom: 0; }

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 16px;
  align-self: flex-start;
}

.typing-indicator span {
  width: 8px;
  height: 8px;
  background: var(--accent-light);
  border-radius: 50%;
  animation: bounce 1.4s ease-in-out infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

#chat-input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
}

#chat-input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#chat-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  color: var(--text-primary);
  font-size: 14px;
  resize: none;
  max-height: 120px;
  min-height: 42px;
  font-family: inherit;
  outline: none;
  line-height: 1.5;
}

#chat-input:focus { border-color: var(--accent); }

#send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}

#send-btn:hover { background: var(--accent-dark); }
#send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.chip {
  padding: 4px 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.chip:hover { border-color: var(--accent); color: var(--accent-light); }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== TOOLS PANEL ===== */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  padding: 20px;
  overflow-y: auto;
}

.tool-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: var(--transition);
}

.tool-card:hover { border-color: var(--accent); }

.tool-card .tool-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.tool-card .tool-name {
  font-weight: 600;
  font-size: 15px;
}

.tool-card .tool-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  line-height: 1.5;
}

.tool-card .tool-params {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
  background: var(--bg-primary);
  padding: 8px;
  border-radius: var(--radius);
  max-height: 100px;
  overflow-y: auto;
}

.toggle-switch {
  position: relative;
  width: 44px;
  height: 24px;
  cursor: pointer;
}

.toggle-switch input { display: none; }

.toggle-slider {
  position: absolute;
  inset: 0;
  background: var(--bg-tertiary);
  border-radius: 24px;
  transition: var(--transition);
}

.toggle-slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  bottom: 3px;
  background: var(--text-secondary);
  border-radius: 50%;
  transition: var(--transition);
}

.toggle-switch input:checked + .toggle-slider { background: var(--accent); }
.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(20px);
  background: #fff;
}

/* ===== SKILLS PANEL ===== */
.skills-container {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.skill-editor {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  height: 100%;
}

.skill-list-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.skill-edit-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.form-group { display: flex; flex-direction: column; gap: 4px; }

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group textarea,
.form-group select {
  padding: 8px 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus { border-color: var(--accent); }

.form-group textarea {
  min-height: 100px;
  resize: vertical;
  font-family: 'Fira Code', monospace;
}

/* ===== PROMPTS PANEL ===== */
.prompts-container {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.prompt-categories {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.prompt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.prompt-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  cursor: pointer;
  transition: var(--transition);
}

.prompt-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.prompt-card .prompt-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 6px;
}

.prompt-card .prompt-preview {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.prompt-card .prompt-tags {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.tag {
  padding: 2px 8px;
  background: var(--bg-tertiary);
  border-radius: 10px;
  font-size: 10px;
  color: var(--accent-light);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 90%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal h2 {
  margin-bottom: 16px;
  font-size: 18px;
}

.modal .form-group { margin-bottom: 12px; }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== EMPTY STATE ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  gap: 12px;
}

.empty-state .icon { font-size: 48px; }
.empty-state .text { font-size: 14px; }

/* ===== STATUS INDICATOR ===== */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.status-dot.online { background: var(--success); }
.status-dot.offline { background: var(--danger); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
}
</style>
</head>

<div id="app">
  <!-- HEADER -->
  <header id="header">
    <div class="logo">⚡ AI Agent</div>

      <div id="chat-input-area">

        <h3 style="flex:1;">Skills</h3>
        <button class="btn btn-primary btn-sm" id="add-skill-btn">+ Новый Skill</button>
      </div>
      <div class="skills-container" id="skills-container"></div>

    <!-- PROMPTS PANEL -->
    <div class="panel" id="panel-prompts">

        <h3 style="flex:1;">Библиотека промптов</h3>
        <button class="btn btn-primary btn-sm" id="add-prompt-btn">+ Новый промпт</button>
      </div>
      <div class="prompts-container" id="prompts-container"></div>
    </div>
  </main>
</div>

<!-- MODALS CONTAINER -->
<div id="modals"></div>

<script>
// ============================================================
//  1. DATABASE LAYER — IndexedDB wrapper
// ============================================================
class AgentDB {
  constructor(name = 'ai_agent_db', version = 4) {
    this.name = name;
    this.version = version;
    this.db = null;
  }

  async open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.version);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('chats')) {
          const s = db.createObjectStore('chats', { keyPath: 'id' });
          s.createIndex('updatedAt', 'updatedAt');
        }
        if (!db.objectStoreNames.contains('messages')) {
          const s = db.createObjectStore('messages', { keyPath: 'id' });
          s.createIndex('chatId', 'chatId');
          s.createIndex('chatId_ts', ['chatId', 'timestamp']);
        }
        if (!db.objectStoreNames.contains('tools')) {
          db.createObjectStore('tools', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('skills')) {
          db.createObjectStore('skills', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('prompts')) {
          const s = db.createObjectStore('prompts', { keyPath: 'id' });
          s.createIndex('category', 'category');
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  _tx(store, mode = 'readonly') {
    return this.db.transaction(store, mode).objectStore(store);
  }

  async getAll(store) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async get(store, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async put(store, obj) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store, 'readwrite').put(obj);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async delete(store, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store, 'readwrite').delete(key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async getAllByIndex(store, indexName, value) {
    return new Promise((resolve, reject) => {
      const index = this._tx(store).index(indexName);
      const req = index.getAll(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
}

// ============================================================
//  2. LLM GATEWAY — OpenAI-compatible API client
// ============================================================
class LLMGateway {
  constructor() {
    this.apiUrl = '';
    this.apiKey = '';
    this.model = '';
    this.maxTokens = 4096;
    this.temperature = 0.7;
    this.authType = 'bearer'; // 'bearer' | 'custom'
    this.customHeaderName = '';
    this.customHeaderValue = '';
    this.availableModels = [];
  }

  configure({ apiUrl, apiKey, model, maxTokens, temperature, authType, customHeaderName, customHeaderValue }) {
    if (apiUrl !== undefined) this.apiUrl = apiUrl.replace(/\/+$/, '');
    if (apiKey !== undefined) this.apiKey = apiKey;
    if (model !== undefined) this.model = model;
    if (maxTokens !== undefined) this.maxTokens = maxTokens;
    if (temperature !== undefined) this.temperature = temperature;
    if (authType !== undefined) this.authType = authType;
    if (customHeaderName !== undefined) this.customHeaderName = customHeaderName;
    if (customHeaderValue !== undefined) this.customHeaderValue = customHeaderValue;
  }

  _buildAuthHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (this.authType === 'custom' && this.customHeaderName) {
      headers[this.customHeaderName] = this.customHeaderValue;
    } else if (this.apiKey) {
      headers['Authorization'] = 'Bearer ' + this.apiKey;
    }
    return headers;
  }

  isConfigured() {
    const hasAuth = this.authType === 'custom'
      ? !!(this.customHeaderName && this.customHeaderValue)
      : !!this.apiKey;
    return !!(this.apiUrl && hasAuth && this.model);
  }

  async chat(messages, { tools = null, stream = false, onChunk = null } = {}) {
    const body = {
      model: this.model,
      messages,
      max_tokens: this.maxTokens,
      temperature: this.temperature,
    };

    if (tools && tools.length > 0) {
      body.tools = tools;
      body.tool_choice = 'auto';
    }

    const endpoint = this.apiUrl + '/chat/completions';
    const headers = this._buildAuthHeaders();

    // --- LOG REQUEST ---
    const logHeaders = Object.assign({}, headers);
    // Mask sensitive values for log
    for (var hk in logHeaders) {
      if (hk.toLowerCase() === 'authorization' || hk.toLowerCase().includes('key') || hk.toLowerCase().includes('secret') || hk.toLowerCase().includes('token')) {
        var val = logHeaders[hk];
        if (val && val.length > 12) {
          logHeaders[hk] = val.substring(0, 8) + '***' + val.substring(val.length - 4);
        }
      }
    }
    console.group('%c🔼 LLM REQUEST', 'color:#6c5ce7;font-weight:bold;font-size:13px;');
    console.log('%cEndpoint:', 'color:#888;', endpoint);
    console.log('%cMethod:', 'color:#888;', 'POST');
    console.log('%cHeaders:', 'color:#888;', logHeaders);
    console.log('%cBody:', 'color:#888;');
    console.dir(JSON.parse(JSON.stringify(body)));
    console.log('%cMessages count:', 'color:#888;', messages.length);
    if (tools) console.log('%cTools count:', 'color:#888;', tools.length);
    console.log('%cStream:', 'color:#888;', stream);
    console.log('%cTimestamp:', 'color:#888;', new Date().toISOString());
    console.groupEnd();

    var requestTimestamp = performance.now();

    if (stream && onChunk) {
      body.stream = true;

      // Re-log body with stream flag
      console.log('%c🔼 LLM REQUEST body.stream set to true', 'color:#6c5ce7;');

      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body),
      });

      var elapsed = (performance.now() - requestTimestamp).toFixed(0);

      if (!resp.ok) {
        const err = await resp.text();
        console.group('%c🔽❌ LLM RESPONSE (STREAM ERROR)', 'color:#e74c3c;font-weight:bold;font-size:13px;');
        console.log('%cStatus:', 'color:#888;', resp.status, resp.statusText);
        console.log('%cResponse Headers:', 'color:#888;');
        resp.headers.forEach(function(v, k) { console.log('  ' + k + ': ' + v); });
        console.log('%cError Body:', 'color:#e74c3c;', err);
        console.log('%cElapsed:', 'color:#888;', elapsed + 'ms');
        console.groupEnd();
        throw new Error('API Error ' + resp.status + ': ' + err);
      }

      // Log response headers for stream
      console.group('%c🔽 LLM RESPONSE (STREAM START)', 'color:#00b894;font-weight:bold;font-size:13px;');
      console.log('%cStatus:', 'color:#888;', resp.status, resp.statusText);
      console.log('%cResponse Headers:', 'color:#888;');
      resp.headers.forEach(function(v, k) { console.log('  ' + k + ': ' + v); });
      console.log('%cTime to first byte:', 'color:#888;', elapsed + 'ms');
      console.groupEnd();

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullContent = '';
      let toolCalls = [];
      var chunkCount = 0;
      var rawChunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        var decodedChunk = decoder.decode(value, { stream: true });
        buffer += decodedChunk;
        rawChunks.push(decodedChunk);
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed === 'data: [DONE]') continue;
          if (!trimmed.startsWith('data: ')) continue;
          try {
            const json = JSON.parse(trimmed.slice(6));
            chunkCount++;
            const delta = json.choices?.[0]?.delta;
            if (delta?.content) {
              fullContent += delta.content;
              onChunk(delta.content);
            }
            if (delta?.tool_calls) {
              for (const tc of delta.tool_calls) {
                const idx = tc.index ?? 0;
                if (!toolCalls[idx]) {
                  toolCalls[idx] = { id: tc.id || '', type: 'function', function: { name: '', arguments: '' } };
                }
                if (tc.id) toolCalls[idx].id = tc.id;
                if (tc.function?.name) toolCalls[idx].function.name += tc.function.name;
                if (tc.function?.arguments) toolCalls[idx].function.arguments += tc.function.arguments;
              }
            }
          } catch (e) { /* skip */ }
        }
      }

      var totalElapsed = (performance.now() - requestTimestamp).toFixed(0);
      var result = {
        content: fullContent,
        tool_calls: toolCalls.length > 0 ? toolCalls : null,
      };

      console.group('%c🔽 LLM RESPONSE (STREAM COMPLETE)', 'color:#00b894;font-weight:bold;font-size:13px;');
      console.log('%cTotal chunks:', 'color:#888;', chunkCount);
      console.log('%cTotal elapsed:', 'color:#888;', totalElapsed + 'ms');
      console.log('%cContent length:', 'color:#888;', fullContent.length + ' chars');
      console.log('%cContent preview:', 'color:#888;', fullContent.substring(0, 300) + (fullContent.length > 300 ? '...' : ''));
      if (result.tool_calls) {
        console.log('%cTool Calls:', 'color:#f39c12;');
        console.dir(result.tool_calls);
      }
      console.log('%cFull assembled response:', 'color:#888;');
      console.dir(result);
      console.groupEnd();

      return result;
    }

    // ===== Non-streaming =====
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body),
    });

    var elapsed2 = (performance.now() - requestTimestamp).toFixed(0);

    if (!resp.ok) {
      const err = await resp.text();
      console.group('%c🔽❌ LLM RESPONSE (ERROR)', 'color:#e74c3c;font-weight:bold;font-size:13px;');
      console.log('%cStatus:', 'color:#888;', resp.status, resp.statusText);
      console.log('%cResponse Headers:', 'color:#888;');
      resp.headers.forEach(function(v, k) { console.log('  ' + k + ': ' + v); });
      console.log('%cError Body:', 'color:#e74c3c;', err);
      console.log('%cElapsed:', 'color:#888;', elapsed2 + 'ms');
      console.groupEnd();
      throw new Error('API Error ' + resp.status + ': ' + err);
    }

    const data = await resp.json();
    const choice = data.choices[0];
    var result2 = {
      content: choice.message.content || '',
      tool_calls: choice.message.tool_calls || null,
    };

    console.group('%c🔽 LLM RESPONSE (COMPLETE)', 'color:#00b894;font-weight:bold;font-size:13px;');
    console.log('%cStatus:', 'color:#888;', resp.status, resp.statusText);
    console.log('%cResponse Headers:', 'color:#888;');
    resp.headers.forEach(function(v, k) { console.log('  ' + k + ': ' + v); });
    console.log('%cElapsed:', 'color:#888;', elapsed2 + 'ms');
    console.log('%cFull API Response:', 'color:#888;');
    console.dir(data);
    console.log('%cUsage:', 'color:#888;', data.usage || 'N/A');
    console.log('%cFinish reason:', 'color:#888;', choice.finish_reason);
    console.log('%cContent length:', 'color:#888;', result2.content.length + ' chars');
    console.log('%cContent:', 'color:#888;', result2.content.substring(0, 500) + (result2.content.length > 500 ? '...' : ''));
    if (result2.tool_calls) {
      console.log('%cTool Calls:', 'color:#f39c12;font-weight:bold;');
      console.dir(result2.tool_calls);
    }
    console.groupEnd();

    return result2;
  }

  async fetchModels(apiUrl, authHeaders) {
    const url = (apiUrl || this.apiUrl).replace(/\/+$/, '');

class ToolsEngine {
  constructor(db) {
    this.db = db;
    this.registry = new Map(); // id -> tool definition + handler
    this._initBuiltinTools();
  }

  _initBuiltinTools() {
    // Built-in: current_time
    this.registerHandler('builtin_time', async () => {
      return { time: new Date().toISOString(), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };
    });

    // Built-in: calculator
    this.registerHandler('builtin_calc', async (params) => {
      try {
        // Safe math eval (no eval)
        const expr = params.expression;
        const fn = new Function('return ' + expr.replace(/[^0-9+\-*/().%\s]/g, ''));
        return { result: fn(), expression: expr };
      } catch (e) {
        return { error: e.message };
      }
    });

    // Built-in: local_storage read/write
    this.registerHandler('builtin_memory', async (params) => {
      if (params.action === 'read') {
        const val = localStorage.getItem('agent_memory_' + params.key);
        return { key: params.key, value: val ? JSON.parse(val) : null };
      } else if (params.action === 'write') {
        localStorage.setItem('agent_memory_' + params.key, JSON.stringify(params.value));
        return { success: true, key: params.key };
      } else if (params.action === 'list') {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k.startsWith('agent_memory_')) keys.push(k.replace('agent_memory_', ''));
        }
        return { keys };
      }
      return { error: 'Unknown action' };
    });

    // Built-in: fetch URL (proxy-free, limited by CORS)
    this.registerHandler('builtin_fetch', async (params) => {
      try {
        const resp = await fetch(params.url, { method: params.method || 'GET' });
        const text = await resp.text();
        return { status: resp.status, body: text.substring(0, 4000) };
      } catch (e) {
        return { error: e.message };
      }
    });
  }

  registerHandler(toolId, handler) {
    if (!this.registry.has(toolId)) {
      this.registry.set(toolId, { handler });
    } else {
      this.registry.get(toolId).handler = handler;
    }
  }

  async loadTools() {
    const tools = await this.db.getAll('tools');
    if (tools.length === 0) {
      // Seed built-in tools
      const builtins = [
        {
          id: 'builtin_time',
          name: 'get_current_time',
          description: 'Возвращает текущие дату и время с часовым поясом',
          parameters: { type: 'object', properties: {}, required: [] },
          enabled: true,
          builtin: true,
        },
        {
          id: 'builtin_calc',
          name: 'calculator',
          description: 'Вычисляет математическое выражение',
          parameters: {
            type: 'object',
            properties: { expression: { type: 'string', description: 'Математическое выражение, например 2+2*3' } },
            required: ['expression'],
          },
          enabled: true,
          builtin: true,
        },
        {
          id: 'builtin_memory',
          name: 'persistent_memory',
          description: 'Читает/записывает данные в персистентную память агента. Actions: read, write, list',
          parameters: {
            type: 'object',
            properties: {
              action: { type: 'string', enum: ['read', 'write', 'list'] },
              key: { type: 'string', description: 'ключ для чтения/записи' },
              value: { description: 'значение для записи (любой тип)' },
            },
            required: ['action'],
          },
          enabled: true,
          builtin: true,
        },
        {
          id: 'builtin_fetch',
          name: 'http_fetch',
          description: 'Выполняет HTTP-запрос к указанному URL (ограничено CORS)',
          parameters: {
            type: 'object',
            properties: {
              url: { type: 'string', description: 'URL для запроса' },
              method: { type: 'string', enum: ['GET', 'POST'], description: 'HTTP метод' },
            },
            required: ['url'],
          },
          enabled: true,
          builtin: true,
        },
      ];
      for (const t of builtins) await this.db.put('tools', t);
      return builtins;
    }
    return tools;
  }

  async getEnabledToolsForAPI() {
    const tools = await this.loadTools();
    return tools
      .filter(t => t.enabled)
      .map(t => ({
        type: 'function',
        function: {
          name: t.name,
          description: t.description,
          parameters: t.parameters,
        },
      }));
  }

  async executeTool(toolName, args) {
    var parsedArgs;
    try {
      parsedArgs = typeof args === 'string' ? JSON.parse(args) : args;
    } catch(e) {
      parsedArgs = args;
    }

    console.group('%c🔧 TOOL CALL', 'color:#f39c12;font-weight:bold;font-size:13px;');
    console.log('%cTool:', 'color:#888;', toolName);
    console.log('%cArguments:', 'color:#888;');
    console.dir(parsedArgs);
    console.log('%cTimestamp:', 'color:#888;', new Date().toISOString());
    var t0 = performance.now();

    const tools = await this.loadTools();
    const tool = tools.find(function(t) { return t.name === toolName; });

    if (!tool) {
      var errResult = { error: 'Tool "' + toolName + '" not found' };
      console.log('%c❌ Result:', 'color:#e74c3c;', errResult);
      console.groupEnd();
      return errResult;
    }

    const entry = this.registry.get(tool.id);
    var result;

    if (entry?.handler) {
      try {
        result = await entry.handler(parsedArgs);
      } catch (e) {
        result = { error: e.message };
      }
    } else if (tool.handlerCode) {
      try {
        const fn = new Function('params', tool.handlerCode);
        result = await fn(parsedArgs);
      } catch (e) {
        result = { error: 'Execution error: ' + e.message };
      }
    } else {
      result = { error: 'No handler registered for tool "' + toolName + '"' };
    }

    var elapsed = (performance.now() - t0).toFixed(0);
    console.log('%c✅ Result:', 'color:#00b894;');
    console.dir(result);
    console.log('%cElapsed:', 'color:#888;', elapsed + 'ms');
    console.groupEnd();

    return result;
  }
}

// ============================================================
//  6. MARKDOWN RENDERER (lightweight)
// ============================================================
function renderMarkdown(text) {
  if (!text) return '';
  // Code blocks
  var html = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>');
  // Inline code — используем RegExp конструктор, чтобы избежать конфликта с обратными кавычками
  var inlineCodeRe = new RegExp('[`]([^`]+)[`]', 'g');
  html = html.replace(inlineCodeRe, '<code>$1</code>');
  // Bold (before italic)
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

class UI {
  constructor(agent) {
    this.agent = agent;
    this.currentTab = 'chat';
    this.currentChatId = null;
    this.isStreaming = false;
    this._bindGlobalEvents();
  }

  // === Global events ===
  _bindGlobalEvents() {
    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => this.switchTab(btn.dataset.tab));
    });

    // Settings
    document.getElementById('settings-btn').addEventListener('click', () => this.showSettingsModal());

    // Sidebar new button
    document.getElementById('sidebar-new-btn').addEventListener('click', () => this._handleNewItem());

    // Sidebar search
    document.getElementById('sidebar-search').addEventListener('input', (e) => this._handleSearch(e.target.value));

    // Chat input
    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.sendMessage();
      }
    });
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });

    document.getElementById('send-btn').addEventListener('click', () => this.sendMessage());

    // Tools buttons
    document.getElementById('add-tool-btn').addEventListener('click', () => this.showAddToolModal());
    document.getElementById('add-mcp-server-btn').addEventListener('click', () => this.showAddMCPServerModal());

    // Skills button
    document.getElementById('add-skill-btn').addEventListener('click', () => this.showAddSkillModal());

    // Prompts button
    document.getElementById('add-prompt-btn').addEventListener('click', () => this.showAddPromptModal());
  }

  // === Tab switching ===
  switchTab(tab) {
    this.currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));

    this.refreshSidebar();
    if (tab === 'tools') this.renderTools();
    if (tab === 'skills') this.renderSkills();
    if (tab === 'prompts') this.renderPrompts();
  }

  // === Sidebar ===
  async refreshSidebar() {
    const list = document.getElementById('sidebar-list');
    const search = document.getElementById('sidebar-search').value.toLowerCase();

    if (this.currentTab === 'chat') {
      const chats = await this.agent.db.getAll('chats');
      chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      const filtered = chats.filter(c => !search || c.title.toLowerCase().includes(search));

      list.innerHTML = filtered.map(c => `
        <div class="sidebar-item ${c.id === this.currentChatId ? 'active' : ''}" data-id="${c.id}">
          <span class="title">${this._escHtml(c.title)}</span>
          <button class="delete-btn" data-delete="${c.id}" title="Удалить">✕</button>
        </div>
      `).join('') || '<div class="empty-state"><div class="text">Нет чатов</div></div>';

      list.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.dataset.delete) return;
          this.loadChat(item.dataset.id);
        });
      });

      list.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await this.deleteChat(btn.dataset.delete);
        });
      });
    } else if (this.currentTab === 'prompts') {
      const prompts = await this.agent.prompts.loadPrompts();
      const filtered = prompts.filter(p => !search || p.title.toLowerCase().includes(search));
      list.innerHTML = filtered.map(p => `
        <div class="sidebar-item" data-id="${p.id}">
          <span class="title">${this._escHtml(p.title)}</span>
          <span class="meta">${p.category}</span>
        </div>
      `).join('');

      list.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', () => this.usePrompt(item.dataset.id));
      });
    } else {
      list.innerHTML = '';
    }
  }

  _handleNewItem() {
    if (this.currentTab === 'chat') this.newChat();
    else if (this.currentTab === 'tools') this.showAddToolModal();
    else if (this.currentTab === 'skills') this.showAddSkillModal();
    else if (this.currentTab === 'prompts') this.showAddPromptModal();
  }

  _handleSearch(value) {
    this.refreshSidebar();
  }

  // === Chat ===
  async newChat() {
    const chat = {
      id: uid(),
      title: 'Новый чат',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      skillIds: [],
      model: this.agent.llm.model,
    };
    await this.agent.db.put('chats', chat);
    await this.loadChat(chat.id);
  }

  async loadChat(chatId) {
    this.currentChatId = chatId;
    const messages = await this.agent.db.getAllByIndex('messages', 'chatId', chatId);
    messages.sort((a, b) => a.timestamp - b.timestamp);

    const container = document.getElementById('chat-messages');
    if (messages.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">✨</div>
          <div class="text">Начните диалог</div>
        </div>`;
    } else {
      container.innerHTML = messages.map(m => this._renderMessage(m)).join('');
      container.scrollTop = container.scrollHeight;
    }

    this.updateChatToolbar();
    this.refreshSidebar();
	this.updateModelDisplay();
  }

  _renderMessage(msg) {
    if (msg.role === 'tool') {
      return `<div class="message tool-call">🔧 Tool: ${this._escHtml(msg.name)} → ${this._escHtml(typeof msg.content === 'string' ? msg.content.substring(0, 200) : JSON.stringify(msg.content).substring(0, 200))}</div>`;
    }
    if (msg.role === 'system') {
      return `<div class="message system">${this._escHtml(msg.content?.substring(0, 100))}...</div>`;
    }
    const roleClass = msg.role === 'user' ? 'user' : 'assistant';
    const content = msg.role === 'assistant' ? renderMarkdown(msg.content) : this._escHtml(msg.content);
    return `<div class="message ${roleClass}">${content}</div>`;
  }

  async updateChatToolbar() {
    const toolbar = document.getElementById('chat-toolbar');
    const skills = await this.agent.skills.loadSkills();
    const chat = this.currentChatId ? await this.agent.db.get('chats', this.currentChatId) : null;

    toolbar.innerHTML = skills.map(s => `
      <span class="chip ${s.enabled ? 'active' : ''}" data-skill="${s.id}" title="${this._escHtml(s.description)}">
        ${s.icon} ${s.name}
      </span>
    `).join('');

    toolbar.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', async () => {
        const skill = await this.agent.db.get('skills', chip.dataset.skill);
        skill.enabled = !skill.enabled;
        await this.agent.db.put('skills', skill);
        this.updateChatToolbar();
      });
    });
  }

  async sendMessage() {
    if (this.isStreaming) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    if (!this.agent.llm.isConfigured()) {
      this.showSettingsModal();
      return;
    }

    if (!this.currentChatId) await this.newChat();

    input.value = '';
    input.style.height = 'auto';

    // Save user message
    const userMsg = {
      id: uid(),
      chatId: this.currentChatId,
      role: 'user',
      content: text,
      timestamp: Date.now(),
    };
    await this.agent.db.put('messages', userMsg);

    // Update chat title from first message
    const chat = await this.agent.db.get('chats', this.currentChatId);
    if (chat.title === 'Новый чат') {
      chat.title = text.substring(0, 50);
      await this.agent.db.put('chats', chat);
      this.refreshSidebar();
    }
    chat.updatedAt = Date.now();
    await this.agent.db.put('chats', chat);

    // Render user message
    const container = document.getElementById('chat-messages');
    const emptyState = container.querySelector('.empty-state');
    if (emptyState) emptyState.remove();
    container.insertAdjacentHTML('beforeend', this._renderMessage(userMsg));
    container.scrollTop = container.scrollHeight;

    // Generate response
    await this._generateResponse();
  }

  async _generateResponse() {
    this.isStreaming = true;
    document.getElementById('send-btn').disabled = true;
    const container = document.getElementById('chat-messages');

    // Show typing
    container.insertAdjacentHTML('beforeend', '<div class="typing-indicator" id="typing"><span></span><span></span><span></span></div>');
    container.scrollTop = container.scrollHeight;

    try {
      // Build messages array
      const allMsgs = await this.agent.db.getAllByIndex('messages', 'chatId', this.currentChatId);
      allMsgs.sort((a, b) => a.timestamp - b.timestamp);

      // System prompt from active skills
      const systemPrompt = await this.agent.skills.buildSystemPrompt();
      const apiMessages = [{ role: 'system', content: systemPrompt }];

      // Add conversation messages
      for (const m of allMsgs) {
        if (m.role === 'tool') {
          apiMessages.push({ role: 'tool', content: typeof m.content === 'string' ? m.content : JSON.stringify(m.content), tool_call_id: m.tool_call_id, name: m.name });
        } else if (m.role === 'assistant' && m.tool_calls) {
          apiMessages.push({ role: 'assistant', content: m.content || null, tool_calls: m.tool_calls });
        } else {
          apiMessages.push({ role: m.role, content: m.content });
        }
      }

      // Get tools
      const tools = await this.agent.tools.getEnabledToolsForAPI();

      // Remove typing indicator
      document.getElementById('typing')?.remove();

      // Create streaming message element
      const msgEl = document.createElement('div');
      msgEl.className = 'message assistant';
      container.appendChild(msgEl);

      let fullContent = '';

      const result = await this.agent.llm.chat(apiMessages, {
        tools: tools.length > 0 ? tools : null,
        stream: true,
        onChunk: (chunk) => {
          fullContent += chunk;
          msgEl.innerHTML = renderMarkdown(fullContent);
          container.scrollTop = container.scrollHeight;
        },
      });

      // Handle tool calls
      if (result.tool_calls && result.tool_calls.length > 0) {
        // Save assistant message with tool calls
        const assistantMsg = {
          id: uid(),
          chatId: this.currentChatId,
          role: 'assistant',
          content: result.content || '',
          tool_calls: result.tool_calls,
          timestamp: Date.now(),
        };
        await this.agent.db.put('messages', assistantMsg);

        // Execute each tool call
        for (const tc of result.tool_calls) {
          const toolResultDiv = document.createElement('div');
          toolResultDiv.className = 'message tool-call';
          toolResultDiv.textContent = `🔧 Вызываю: ${tc.function.name}(${tc.function.arguments})...`;
          container.appendChild(toolResultDiv);
          container.scrollTop = container.scrollHeight;

          const toolResult = await this.agent.tools.executeTool(tc.function.name, tc.function.arguments);
          const resultStr = JSON.stringify(toolResult);

          toolResultDiv.textContent = `🔧 ${tc.function.name} → ${resultStr.substring(0, 200)}`;

          // Save tool result
          const toolMsg = {
            id: uid(),
            chatId: this.currentChatId,
            role: 'tool',
            content: resultStr,
            tool_call_id: tc.id,
            name: tc.function.name,
            timestamp: Date.now(),
          };
          await this.agent.db.put('messages', toolMsg);
        }

        // Re-generate with tool results
        this.isStreaming = false;
        document.getElementById('send-btn').disabled = false;
        await this._generateResponse();
        return;
      }

      // Save assistant message
      const assistantMsg = {
        id: uid(),
        chatId: this.currentChatId,
        role: 'assistant',
        content: result.content,
        timestamp: Date.now(),
      };
      await this.agent.db.put('messages', assistantMsg);

    } catch (error) {
      document.getElementById('typing')?.remove();
      container.insertAdjacentHTML('beforeend', `<div class="message system">❌ Ошибка: ${this._escHtml(error.message)}</div>`);
      container.scrollTop = container.scrollHeight;
    }

    this.isStreaming = false;
    document.getElementById('send-btn').disabled = false;
  }

  async deleteChat(chatId) {
    await this.agent.db.delete('chats', chatId);
    // Delete messages
    const msgs = await this.agent.db.getAllByIndex('messages', 'chatId', chatId);
    for (const m of msgs) await this.agent.db.delete('messages', m.id);

    if (this.currentChatId === chatId) {
      this.currentChatId = null;
      document.getElementById('chat-messages').innerHTML = '<div class="empty-state"><div class="icon">💬</div><div class="text">Выберите чат</div></div>';
    }
    this.refreshSidebar();
  }

  // === Tools ===
  async renderTools() {
    const tools = await this.agent.tools.loadTools();
    const grid = document.getElementById('tools-grid');

    grid.innerHTML = tools.map(t => `
      <div class="tool-card" data-id="${t.id}">
        <div class="tool-header">
          <span class="tool-name">${this._escHtml(t.name)}</span>
          <label class="toggle-switch">
            <input type="checkbox" ${t.enabled ? 'checked' : ''} data-toggle="${t.id}">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="tool-desc">${this._escHtml(t.description)}</div>
        <div class="tool-params">${this._escHtml(JSON.stringify(t.parameters, null, 2))}</div>
        ${!t.builtin ? `<div style="margin-top:12px"><button class="btn btn-danger btn-sm" data-del-tool="${t.id}">Удалить</button></div>` : ''}
      </div>
    `).join('');

    grid.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('change', async () => {
        const tool = await this.agent.db.get('tools', el.dataset.toggle);
        tool.enabled = el.checked;
        await this.agent.db.put('tools', tool);
      });
    });

    grid.querySelectorAll('[data-del-tool]').forEach(el => {
      el.addEventListener('click', async () => {
        await this.agent.db.delete('tools', el.dataset.delTool);
        this.renderTools();
      });
    });
  }

  // === Skills ===
  async renderSkills() {
    const skills = await this.agent.skills.loadSkills();
    const container = document.getElementById('skills-container');

    container.innerHTML = `<div class="tools-grid">${skills.map(s => `
      <div class="tool-card" data-id="${s.id}">
        <div class="tool-header">
          <span class="tool-name">${s.icon} ${this._escHtml(s.name)}</span>
          <label class="toggle-switch">
            <input type="checkbox" ${s.enabled ? 'checked' : ''} data-skill-toggle="${s.id}">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="tool-desc">${this._escHtml(s.description)}</div>
        <div class="tool-params" style="white-space:pre-wrap">${this._escHtml(s.systemPrompt)}</div>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button class="btn btn-secondary btn-sm" data-edit-skill="${s.id}">✏ Редактировать</button>
          <button class="btn btn-danger btn-sm" data-del-skill="${s.id}">Удалить</button>
        </div>
      </div>
    `).join('')}</div>`;

    container.querySelectorAll('[data-skill-toggle]').forEach(el => {
      el.addEventListener('change', async () => {
        const skill = await this.agent.db.get('skills', el.dataset.skillToggle);
        skill.enabled = el.checked;
        await this.agent.db.put('skills', skill);
      });
    });

    container.querySelectorAll('[data-edit-skill]').forEach(el => {
      el.addEventListener('click', () => this.showAddSkillModal(el.dataset.editSkill));
    });

    container.querySelectorAll('[data-del-skill]').forEach(el => {
      el.addEventListener('click', async () => {
        await this.agent.db.delete('skills', el.dataset.delSkill);
        this.renderSkills();
      });
    });
  }

  // === Prompts ===
  async renderPrompts() {
    const prompts = await this.agent.prompts.loadPrompts();
    const categories = await this.agent.prompts.getCategories();
    const container = document.getElementById('prompts-container');

    const catLabels = { all: '📁 Все', development: '💻 Разработка', content: '✍️ Контент', analysis: '📊 Анализ', learning: '📚 Обучение' };

    container.innerHTML = `
      <div class="prompt-categories">
        ${categories.map(c => `<span class="chip active" data-cat="${c}">${catLabels[c] || c}</span>`).join('')}
      </div>
      <div class="prompt-grid">
        ${prompts.map(p => `
          <div class="prompt-card" data-prompt-id="${p.id}">
            <div class="prompt-title">${this._escHtml(p.title)}</div>
            <div class="prompt-preview">${this._escHtml(p.content)}</div>
            <div class="prompt-tags">
              ${(p.tags || []).map(t => `<span class="tag">${this._escHtml(t)}</span>`).join('')}
            </div>
            <div style="margin-top:8px; display:flex; gap:4px;">
              <button class="btn btn-primary btn-sm" data-use-prompt="${p.id}">Использовать</button>
              <button class="btn btn-secondary btn-sm" data-edit-prompt="${p.id}">✏</button>
              <button class="btn btn-danger btn-sm" data-del-prompt="${p.id}">✕</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    container.querySelectorAll('[data-use-prompt]').forEach(el => {
      el.addEventListener('click', () => this.usePrompt(el.dataset.usePrompt));
    });

    container.querySelectorAll('[data-edit-prompt]').forEach(el => {
      el.addEventListener('click', () => this.showAddPromptModal(el.dataset.editPrompt));
    });

    container.querySelectorAll('[data-del-prompt]').forEach(el => {
      el.addEventListener('click', async () => {
        await this.agent.db.delete('prompts', el.dataset.delPrompt);
        this.renderPrompts();
      });
    });
  }

  async usePrompt(promptId) {
    const prompt = await this.agent.db.get('prompts', promptId);
    if (!prompt) return;

    let content = prompt.content;

    // Check for variables
    const vars = content.match(/\{\{(\w+)\}\}/g);
    if (vars && vars.length > 0) {
      // Show variable input modal
      this._showModal('Заполните переменные', `
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;">${this._escHtml(prompt.title)}</p>
        ${vars.map(v => {
          const name = v.replace(/\{\{|\}\}/g, '');
          return `<div class="form-group"><label>${name}</label><textarea id="var_${name}" rows="2"></textarea></div>`;
        }).join('')}
      `, async () => {
        for (const v of vars) {
          const name = v.replace(/\{\{|\}\}/g, '');
          const val = document.getElementById(`var_${name}`)?.value || '';
          content = content.replaceAll(v, val);
        }
        this.switchTab('chat');
        if (!this.currentChatId) await this.newChat();
        document.getElementById('chat-input').value = content;
      });
    } else {
      this.switchTab('chat');
      if (!this.currentChatId) await this.newChat();
      document.getElementById('chat-input').value = content;
    }
  }

  showSettingsModal() {
    const llm = this.agent.llm;
    const isBearerChecked = llm.authType !== 'custom' ? 'checked' : '';
    const isCustomChecked = llm.authType === 'custom' ? 'checked' : '';
    const customDisplay = llm.authType === 'custom' ? '' : 'display:none;';
    const bearerDisplay = llm.authType !== 'custom' ? '' : 'display:none;';

    this._showModal('⚙ Настройки', '\
      <div class="form-group">\
        <label>API URL (OpenAI-compatible)</label>\
        <input id="s_url" value="' + this._escHtml(llm.apiUrl) + '" placeholder="https://api.example.com/v1">\
      </div>\
      \
      <div class="form-group">\
        <label>Способ авторизации</label>\
        <div style="display:flex;gap:16px;margin-top:4px;">\
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text-primary);">\
            <input type="radio" name="auth_type" value="bearer" ' + isBearerChecked + ' style="width:auto;"> Стандартный OpenAI (Bearer)\
          </label>\
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text-primary);">\
            <input type="radio" name="auth_type" value="custom" ' + isCustomChecked + ' style="width:auto;"> Нестандартный заголовок\
          </label>\
        </div>\
      </div>\
      \
      <div id="auth_bearer_section" style="' + bearerDisplay + '">\
        <div class="form-group">\
          <label>API Key</label>\
          <input id="s_key" type="password" value="' + this._escHtml(llm.apiKey) + '" placeholder="sk-...">\
        </div>\
      </div>\
      \
      <div id="auth_custom_section" style="' + customDisplay + '">\
        <div class="form-group">\
          <label>Имя HTTP заголовка</label>\
          <input id="s_custom_header" value="' + this._escHtml(llm.customHeaderName) + '" placeholder="X-API-Key">\
        </div>\
        <div class="form-group">\
          <label>Значение заголовка</label>\
          <input id="s_custom_value" type="password" value="' + this._escHtml(llm.customHeaderValue) + '" placeholder="your-secret-key">\
        </div>\
      </div>\
      \
      <div class="form-group">\
        <label>Model</label>\
        <div style="display:flex;gap:8px;">\
          <select id="s_model_select" style="flex:1;">\
            <option value="">-- Нажмите &quot;Загрузить модели&quot; --</option>\
          </select>\
          <input id="s_model_manual" value="' + this._escHtml(llm.model) + '" placeholder="или введите вручную" style="flex:1;">\
        </div>\
        <div style="margin-top:4px;font-size:11px;color:var(--text-muted);">Выберите из списка или введите вручную. Приоритет у выпадающего списка.</div>\
      </div>\
      \
      <div class="form-group">\
        <label>Max Tokens</label>\
        <input id="s_tokens" type="number" value="' + llm.maxTokens + '">\
      </div>\
      \
      <div class="form-group">\
        <label>Temperature (0-2)</label>\
        <input id="s_temp" type="number" step="0.1" min="0" max="2" value="' + llm.temperature + '">\
      </div>\
      \
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">\
        <button class="btn btn-success btn-sm" id="test-conn-btn">🔌 Тест и загрузка моделей</button>\
        <span id="conn-result" style="font-size:12px;"></span>\
      </div>\
      <div id="models-status" style="margin-top:8px;font-size:12px;color:var(--text-muted);"></div>\
    ', async () => {
      // Determine selected model
      const selectVal = document.getElementById('s_model_select').value;
      const manualVal = document.getElementById('s_model_manual').value.trim();
      const finalModel = selectVal || manualVal;

      const authType = document.querySelector('input[name="auth_type"]:checked')?.value || 'bearer';

      const config = {
        apiUrl: document.getElementById('s_url').value.trim(),
        apiKey: document.getElementById('s_key').value.trim(),
        model: finalModel,
        maxTokens: parseInt(document.getElementById('s_tokens').value) || 4096,
        temperature: parseFloat(document.getElementById('s_temp').value) || 0.7,
        authType: authType,
        customHeaderName: document.getElementById('s_custom_header').value.trim(),
        customHeaderValue: document.getElementById('s_custom_value').value.trim(),
      };
      llm.configure(config);
      await this.agent.db.put('settings', { key: 'llm', ...config });
      this.updateConnectionStatus();
      this.updateModelDisplay();
    });

    // Deferred event bindings
    setTimeout(() => {
      // Auth type toggle
      document.querySelectorAll('input[name="auth_type"]').forEach(function(radio) {
        radio.addEventListener('change', function() {
          var isBearerSelected = this.value === 'bearer';
          document.getElementById('auth_bearer_section').style.display = isBearerSelected ? '' : 'none';
          document.getElementById('auth_custom_section').style.display = isBearerSelected ? 'none' : '';
        });
      });

      // Populate select if we already have models
      if (llm.availableModels.length > 0) {
        var sel = document.getElementById('s_model_select');
        sel.innerHTML = '<option value="">-- Выберите модель --</option>';
        llm.availableModels.forEach(function(m) {
          var opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          if (m === llm.model) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      // When select changes, update manual field
      document.getElementById('s_model_select').addEventListener('change', function() {
        if (this.value) {
          document.getElementById('s_model_manual').value = this.value;
        }
      });

      // Test connection + load models
      document.getElementById('test-conn-btn').addEventListener('click', async function() {
        var resultEl = document.getElementById('conn-result');
        var modelsEl = document.getElementById('models-status');
        resultEl.textContent = '⏳ Проверяю...';
        resultEl.style.color = 'var(--warning)';
        modelsEl.textContent = '';

        var tmpUrl = document.getElementById('s_url').value.trim();
        var authType = document.querySelector('input[name="auth_type"]:checked')?.value || 'bearer';
        var headers = { 'Content-Type': 'application/json' };

        if (authType === 'custom') {
          var hName = document.getElementById('s_custom_header').value.trim();
          var hVal = document.getElementById('s_custom_value').value.trim();
          if (hName) headers[hName] = hVal;
        } else {
          var key = document.getElementById('s_key').value.trim();
          if (key) headers['Authorization'] = 'Bearer ' + key;
        }

        try {
          var models = await llm.fetchModels(tmpUrl, headers);

          resultEl.textContent = '✅ Подключено!';
          resultEl.style.color = 'var(--success)';
          modelsEl.textContent = 'Найдено моделей: ' + models.length;

          var sel = document.getElementById('s_model_select');
          sel.innerHTML = '<option value="">-- Выберите модель --</option>';

          var currentModel = document.getElementById('s_model_manual').value.trim();

          models.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            if (m === currentModel) opt.selected = true;
            sel.appendChild(opt);
          });

          if (models.length > 0 && !currentModel) {
            sel.selectedIndex = 1;
            document.getElementById('s_model_manual').value = models[0];
          }

        } catch (e) {
          resultEl.textContent = '❌ Ошибка: ' + e.message;
          resultEl.style.color = 'var(--danger)';
          modelsEl.textContent = '';
        }
      });
    }, 50);
  }

  // === Modals ===
  _showModal(title, bodyHtml, onSave, onCancel) {
    const id = 'modal_' + uid();
    const modals = document.getElementById('modals');
    modals.innerHTML = `
      <div class="modal-overlay" id="${id}">
        <div class="modal">
          <h2>${title}</h2>
          ${bodyHtml}
          <div class="modal-actions">
            <button class="btn btn-secondary" id="${id}_cancel">Отмена</button>
            <button class="btn btn-primary" id="${id}_save">Сохранить</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById(`${id}_cancel`).addEventListener('click', () => {
      modals.innerHTML = '';
      onCancel?.();
    });

    document.getElementById(id).addEventListener('click', (e) => {
      if (e.target.id === id) { modals.innerHTML = ''; onCancel?.(); }
    });

    document.getElementById(`${id}_save`).addEventListener('click', async () => {
      await onSave?.();
      modals.innerHTML = '';
    });

    return id;
  }

  

  updateConnectionStatus() {
    const dot = document.querySelector('#connection-status .status-dot');
    dot.className = 'status-dot ' + (this.agent.llm.isConfigured() ? 'online' : 'offline');
  }
  
  updateModelDisplay() {
    // Update topbar with model name when in chat tab
    var existing = document.getElementById('model-badge');
    if (existing) existing.remove();

    if (this.agent.llm.model) {
      var badge = document.createElement('span');
      badge.id = 'model-badge';
      badge.style.cssText = 'font-size:11px; padding:3px 10px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:20px; color:var(--accent-light); white-space:nowrap; max-width:200px; overflow:hidden; text-overflow:ellipsis;';
      badge.textContent = '🤖 ' + this.agent.llm.model;
      badge.title = 'Текущая модель: ' + this.agent.llm.model;
      var settingsBtn = document.getElementById('settings-btn');
      settingsBtn.parentNode.insertBefore(badge, settingsBtn);
    }
  }  

  showAddToolModal(editId = null) {
    const isEdit = !!editId;
    const title = isEdit ? 'Редактировать Tool' : 'Добавить Tool';

    const loadAndShow = async () => {
      const tool = isEdit ? await this.agent.db.get('tools', editId) : null;

      this._showModal(title, `
        <div class="form-group">
          <label>Имя функции (name)</label>
          <input id="t_name" value="${tool ? this._escHtml(tool.name) : ''}" placeholder="my_custom_tool">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="t_desc" rows="2">${tool ? this._escHtml(tool.description) : ''}</textarea>
        </div>
        <div class="form-group">
          <label>Parameters (JSON Schema)</label>
          <textarea id="t_params" rows="6">${tool ? JSON.stringify(tool.parameters, null, 2) : '{\n  "type": "object",\n  "properties": {},\n  "required": []\n}'}</textarea>
        </div>
        <div class="form-group">
          <label>Handler Code (JavaScript, получает params)</label>
          <textarea id="t_handler" rows="5">${tool?.handlerCode || '// return { result: params.input };\n'}</textarea>
        </div>
      `, async () => {
        const id = isEdit ? editId : 'custom_' + uid();
        let params;
        try { params = JSON.parse(document.getElementById('t_params').value); }
        catch { params = { type: 'object', properties: {}, required: [] }; }

        const toolObj = {
          id,
          name: document.getElementById('t_name').value.trim(),
          description: document.getElementById('t_desc').value.trim(),
          parameters: params,
          handlerCode: document.getElementById('t_handler').value,
          enabled: tool?.enabled ?? true,
          builtin: false,
        };
        await this.agent.db.put('tools', toolObj);
        this.renderTools();
      });
    };
    loadAndShow();
  }

  showAddMCPServerModal() {
    this._showModal('Подключить MCP Server', `
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">
        MCP (Model Context Protocol) сервер выставляет tools через HTTP.<br>
        Укажите URL до MCP-совместимого эндпоинта.
      </p>
      <div class="form-group">
        <label>MCP Server URL</label>
        <input id="mcp_url" placeholder="http://localhost:3000/mcp">
      </div>
      <div class="form-group">
        <label>Auth Token (опционально)</label>
        <input id="mcp_token" type="password" placeholder="Bearer token">
      </div>
    `, async () => {
      const url = document.getElementById('mcp_url').value.trim();
      const token = document.getElementById('mcp_token').value.trim();
      if (!url) return;

      try {
        // MCP tools/list request
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const resp = await fetch(url, {
          method: 'POST',
          headers,
          body: JSON.stringify({ jsonrpc: '2.0', method: 'tools/list', id: 1 }),
        });

        const data = await resp.json();
        const mcpTools = data.result?.tools || [];

        for (const mt of mcpTools) {
          const toolObj = {
            id: 'mcp_' + uid(),
            name: mt.name,
            description: mt.description || '',
            parameters: mt.inputSchema || { type: 'object', properties: {}, required: [] },
            enabled: true,
            builtin: false,
            mcpServer: url,
            mcpToken: token,
          };
          await this.agent.db.put('tools', toolObj);

          // Register handler that calls MCP
          this.agent.tools.registerHandler(toolObj.id, async (params) => {
            const h = { 'Content-Type': 'application/json' };
            if (token) h['Authorization'] = `Bearer ${token}`;
            const r = await fetch(url, {
              method: 'POST',
              headers: h,
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'tools/call',
                params: { name: mt.name, arguments: params },
                id: Date.now(),
              }),
            });
            const d = await r.json();
            return d.result?.content?.[0]?.text || d.result || d;
          });
        }

        alert(`Импортировано ${mcpTools.length} tools с MCP-сервера`);
        this.renderTools();
      } catch (e) {
        alert('Ошибка подключения к MCP серверу: ' + e.message);
      }
    });
  }

  showAddSkillModal(editId = null) {
    const loadAndShow = async () => {
      const skill = editId ? await this.agent.db.get('skills', editId) : null;
      const title = skill ? 'Редактировать Skill' : 'Новый Skill';

      this._showModal(title, `
        <div class="form-group">
          <label>Иконка</label>
          <input id="sk_icon" value="${skill?.icon || '🤖'}" maxlength="4" style="width:60px">
        </div>
        <div class="form-group">
          <label>Название</label>
          <input id="sk_name" value="${skill ? this._escHtml(skill.name) : ''}" placeholder="Мой навык">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <input id="sk_desc" value="${skill ? this._escHtml(skill.description) : ''}" placeholder="Краткое описание">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="sk_cat">
            <option value="development" ${skill?.category === 'development' ? 'selected' : ''}>Development</option>
            <option value="content" ${skill?.category === 'content' ? 'selected' : ''}>Content</option>
            <option value="analysis" ${skill?.category === 'analysis' ? 'selected' : ''}>Analysis</option>
            <option value="custom" ${skill?.category === 'custom' ? 'selected' : ''}>Custom</option>
          </select>
        </div>
        <div class="form-group">
          <label>System Prompt</label>
          <textarea id="sk_prompt" rows="6">${skill ? this._escHtml(skill.systemPrompt) : ''}</textarea>
        </div>
      `, async () => {
        const obj = {
          id: editId || 'skill_' + uid(),
          icon: document.getElementById('sk_icon').value || '🤖',
          name: document.getElementById('sk_name').value.trim(),
          description: document.getElementById('sk_desc').value.trim(),
          category: document.getElementById('sk_cat').value,
          systemPrompt: document.getElementById('sk_prompt').value.trim(),
          enabled: skill?.enabled ?? false,
        };
        await this.agent.db.put('skills', obj);
        this.renderSkills();
        this.updateChatToolbar();
      });
    };
    loadAndShow();
  }

  showAddPromptModal(editId = null) {
    const loadAndShow = async () => {
      const prompt = editId ? await this.agent.db.get('prompts', editId) : null;
      const title = prompt ? 'Редактировать промпт' : 'Новый промпт';

      this._showModal(title, `
        <div class="form-group">
          <label>Название</label>
          <input id="pr_title" value="${prompt ? this._escHtml(prompt.title) : ''}" placeholder="Название промпта">
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="pr_cat">
            <option value="development" ${prompt?.category === 'development' ? 'selected' : ''}>Development</option>
            <option value="content" ${prompt?.category === 'content' ? 'selected' : ''}>Content</option>
            <option value="analysis" ${prompt?.category === 'analysis' ? 'selected' : ''}>Analysis</option>
            <option value="learning" ${prompt?.category === 'learning' ? 'selected' : ''}>Learning</option>
            <option value="custom" ${prompt?.category === 'custom' ? 'selected' : ''}>Custom</option>
          </select>
        </div>
        <div class="form-group">
          <label>Теги (через запятую)</label>
          <input id="pr_tags" value="${prompt?.tags?.join(', ') || ''}" placeholder="тег1, тег2">
        </div>
        <div class="form-group">
          <label>Контент (используйте {{variable}} для переменных)</label>
          <textarea id="pr_content" rows="8">${prompt ? this._escHtml(prompt.content) : ''}</textarea>
        </div>
      `, async () => {
        const content = document.getElementById('pr_content').value;
        const variables = [...new Set((content.match(/\{\{(\w+)\}\}/g) || []).map(v => v.replace(/\{\{|\}\}/g, '')))];
        const obj = {
          id: editId || 'p_' + uid(),
          title: document.getElementById('pr_title').value.trim(),
          category: document.getElementById('pr_cat').value,
          tags: document.getElementById('pr_tags').value.split(',').map(s => s.trim()).filter(Boolean),
          content,
          variables,
          createdAt: prompt?.createdAt || Date.now(),
        };
        await this.agent.db.put('prompts', obj);
        this.renderPrompts();
        this.refreshSidebar();
      });
    };
    loadAndShow();
  }

  // === Helpers ===
  _escHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
}

// ============================================================
//  8. AGENT CORE — Orchestrator
// ============================================================
class AIAgent {
  constructor() {
    this.db = new AgentDB();
    this.llm = new LLMGateway();
    this.tools = null;
    this.skills = null;
    this.prompts = null;
    this.ui = null;
  }

  async init() {
    // 1. Open DB
    await this.db.open();

    // 2. Init engines
    this.tools = new ToolsEngine(this.db);
    this.skills = new SkillsEngine(this.db);
    this.prompts = new PromptsLibrary(this.db);

    // 3. Load settings
    const settings = await this.db.get('settings', 'llm');
    if (settings) {
      this.llm.configure(settings);
    }

    // 4. Load tools (seed defaults if needed)
    await this.tools.loadTools();
    await this.skills.loadSkills();
    await this.prompts.loadPrompts();

    // 5. Init UI
    this.ui = new UI(this);
    this.ui.updateConnectionStatus();
	this.ui.updateModelDisplay();
    this.ui.refreshSidebar();
    this.ui.updateChatToolbar();

    console.log('🚀 AI Agent initialized');
  }
}

// ============================================================
//  9. BOOTSTRAP
// ============================================================
const agent = new AIAgent();
agent.init().catch(err => console.error('Agent init failed:', err));

</script>
